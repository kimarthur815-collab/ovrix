<tr><td>조준 보정 <span style="color:#6f7286">· 공격·막기를 가까운 상대 쪽으로</span></td><td><button id="aimB" class="kb"></button></td></tr>

<p class="sub">바꿀 동작을 누른 다음 원하는 키를 누르세요. 공격은 마우스로 고정이에요.</p>

<div class="row"><button id="kdef">기본값으로</button><button class="primary" id="kback">돌아가기</button></div>
</div></div>
<script>
'use strict';
const DEG=Math.PI/180,FIX=1/60;
const $=id=>document.getElementById(id);
const cv=$('c'),mctx=cv.getContext('2d');let ctx=mctx;
let DPR=1,VW=0,VH=0;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);VW=cv.width=Math.round(innerWidth*DPR);VH=cv.height=Math.round(innerHeight*DPR)}
addEventListener('resize',resize);resize();
const lerp3=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];

function makeTools(G){
  const S=2,W=G.W,D=G.D,H=G.H,M=G.M;
  const I=(x,y,z)=>x+W*(y+D*z),inb=(x,y,z)=>x>=0&&y>=0&&z>=0&&x<W&&y<D&&z<H;
  const put=(i,c,m)=>{if(m===1){if(M[i])M[i]=c}else if(m===3){if(M[i]===c[0])M[i]=c[1]}else M[i]=c};
  const RH=(x0,y0,z0,x1,y1,z1,c,from)=>{x0=Math.max(0,x0);y0=Math.max(0,y0);z0=Math.max(0,z0);x1=Math.min(W-1,x1);y1=Math.min(D-1,y1);z1=Math.min(H-1,z1);for(let z=z0;z<=z1;z++)for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const i=I(x,y,z),v=M[i];if(v&&(from===undefined||v===from))M[i]=c}};
  const R=(x0,y0,z0,x1,y1,z1,c,from)=>RH(Math.round(x0*S),Math.round(y0*S),Math.round(z0*S),Math.round((x1+1)*S)-1,Math.round((y1+1)*S)-1,Math.round((z1+1)*S)-1,c,from);
  const rng=(a,b,n)=>[Math.max(0,Math.floor(a*S)),Math.min(n-1,Math.ceil(b*S))];
  const E=(cx,cy,cz,rx,ry,rz,c,m)=>{const[x0,x1]=rng(cx-rx,cx+rx,W),[y0,y1]=rng(cy-ry,cy+ry,D),[z0,z1]=rng(cz-rz,cz+rz,H);for(let z=z0;z<=z1;z++)for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const a=((x+.5)/S-cx)/rx,b=((y+.5)/S-cy)/ry,d=((z+.5)/S-cz)/rz;if(a*a+b*b+d*d<=1)put(I(x,y,z),c,m)}};
  const K=(A,B,r,c,m)=>{const dx=B[0]-A[0],dy=B[1]-A[1],dz=B[2]-A[2],L2=dx*dx+dy*dy+dz*dz||1;const[x0,x1]=rng(Math.min(A[0],B[0])-r,Math.max(A[0],B[0])+r,W),[y0,y1]=rng(Math.min(A[1],B[1])-r,Math.max(A[1],B[1])+r,D),[z0,z1]=rng(Math.min(A[2],B[2])-r,Math.max(A[2],B[2])+r,H);for(let z=z0;z<=z1;z++)for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const px=(x+.5)/S-A[0],py=(y+.5)/S-A[1],pz=(z+.5)/S-A[2];let t=(px*dx+py*dy+pz*dz)/L2;t=t<0?0:t>1?1:t;const qx=px-t*dx,qy=py-t*dy,qz=pz-t*dz;if(qx*qx+qy*qy+qz*qz<=r*r)put(I(x,y,z),c,m)}};
  const fy=(x,z,y1,y0)=>{for(let y=Math.min(D-1,y1);y>=Math.max(0,y0);y--)if(inb(x,y,z)&&M[I(x,y,z)])return y;return -1};
  const by=(x,z,y0,y1)=>{for(let y=Math.max(0,y0);y<=Math.min(D-1,y1);y++)if(inb(x,y,z)&&M[I(x,y,z)])return y;return -1};
  const tz=(x,y,z1,z0)=>{for(let z=Math.min(H-1,z1);z>=Math.max(0,z0);z--)if(inb(x,y,z)&&M[I(x,y,z)])return z;return -1};
  return{W,D,H,M,I,RH,R,E,K,fy,by,tz};
}

const P1={hood:0x3a3d52,hood2:0x2a2c3d,glove:0xc8323c,gloveHi:0xe35d66,wrap:0xe8e8ee,shorts:0x1c1d29,band:0xc8323c,shoe:0xe4e4ec,sole:0x4a4a55,leg:0x23242e,eye:0xffe9c2,face:0x09090d,string:0xd8d8e0,emblem:0xc8323c};
const P2={hood:0xd6d5dc,hood2:0xa9a8b2,glove:0x1f1f25,gloveHi:0x3c3c48,wrap:0x2a2a30,shorts:0xe2e2e8,band:0x1f1f25,shoe:0x1f1f25,sole:0xd6d6dc,leg:0xc9c9d0,eye:0xff5a5a,face:0x0c0c10,string:0x1f1f25,emblem:0x1f1f25};
const EYES=[[20,76],[21,76],[20,77],[21,77],[26,76],[27,76],[26,77],[27,77]];
const EMB=['.######.','##....##','##......','##......','.######.','......##','......##','##....##','.######.'];

function buildShade(G,o,J){
  G.M.fill(0);
  const{W,D,H,M,I,RH,R,E,K,fy,by,tz}=makeTools(G);
  const bx=J.body[0],byy=J.body[1],bz=J.body[2],add=p=>[p[0]+bx,p[1]+byy,p[2]+bz];
  const hx=Math.round(bx*2),hy=Math.round(byy*2),hz=Math.round(bz*2);
  for(const g of [J.L,J.R]){K(g.ank,g.kn,2,o.leg);K(g.kn,add(g.hip),2.5,o.leg)}
  for(const g of [J.L,J.R])K(g.fa,g.fb,1.7,o.shoe);
  RH(0,0,0,W-1,D-1,0,o.sole,o.shoe);
  E(12+bx,10+byy,17+bz,5.6,3.9,3.4,o.shorts);
  for(const g of [J.L,J.R]){const h=add(g.hip);K(lerp3(g.kn,h,.45),h,2.8,o.shorts)}
  R(0,0,19+bz,23,35,20+bz,o.band,o.shorts);
  E(12+bx,10+byy,26+bz,5.4,3.6,6.2,o.hood);R(0,0,20+bz,23,35,21+bz,o.hood2,o.hood);
  E(12+bx,10+byy,31+bz,7.2,3.5,2.4,o.hood);
  E(12+bx,10.6+byy,38+bz,4.7,4.9,5.3,o.hood);E(12+bx,9.8+byy,42.4+bz,3.2,3.4,1.8,o.hood);E(12+bx,9.2+byy,33.6+bz,4,2.6,2.4,o.hood);
  const ox=12+bx,oz=37.6+bz,rx=2.9,rz=3.4,yc=Math.max(0,28+hy),zs=Math.max(0,60+hz),fh=31+hy,fl=14+hy;
  for(let z=zs;z<H;z++)for(let x=0;x<W;x++){const a=((x+.5)/2-ox)/rx,b=((z+.5)/2-oz)/rz;if(a*a+b*b<=1)for(let y=yc;y<D;y++)M[I(x,y,z)]=0}
  for(let z=zs;z<H;z++)for(let x=0;x<W;x++){const a=((x+.5)/2-ox)/rx,b=((z+.5)/2-oz)/rz,e=a*a+b*b;if(e>1.7)continue;const f=fy(x,z,fh,fl);if(f<0)continue;if(e<=1)M[I(x,f,z)]=o.face;else if(z>=70+hz)M[I(x,f,z)]=o.hood2}
  for(const[ex,ez]of EYES){const x=ex+hx,z=ez+hz,f=fy(x,z,fh,fl);if(f>=0)M[I(x,f,z)]=o.eye}
  for(const xs of [21+hx,26+hx])for(let z=58+hz;z<=69+hz;z++){const f=fy(xs,z,34+hy,14+hy);if(f>=0&&f+1<D)M[I(xs,f+1,z)]=z<=59+hz?0xb8b8c0:o.string}
  R(9+bx,12+byy,21+bz,14+bx,35,23+bz,o.hood2,o.hood);
  EMB.forEach((row,r)=>{for(let c=0;c<8;c++)if(row[c]==='#'){const x=20+c+hx,z=60-r+hz,b=by(x,z,8+hy,24+hy);if(b>=0)M[I(x,b,z)]=o.emblem}});
  for(const x of [23+hx,24+hx])for(let y=0;y<D;y++){const z=tz(x,y,H-1,70+hz);if(z>=74+hz&&M[I(x,y,z)]===o.hood)M[I(x,y,z)]=o.hood2}
  for(const[A,s]of [[J.la,1],[J.ra,-1]]){
    const sh=add(A.sh),el=add(A.el),wr=add(A.wr),gl=add(A.gl);
    K(sh,el,2.1,o.hood);K(el,wr,1.8,o.hood);K(lerp3(el,wr,.55),lerp3(el,wr,.72),1.95,o.hood2);K(lerp3(el,wr,.77),wr,1.9,o.wrap);
    E(gl[0],gl[1],gl[2],2.5,2.8,2.7,o.glove);E(gl[0]+2*s,gl[1]+.2,gl[2]-.6,.8,1.3,1.1,o.glove);E(gl[0],gl[1],gl[2]+1.9,2.2,2.4,1,[o.glove,o.gloveHi],3);
  }
  for(const g of [J.L,J.R])for(const t of [.72,.84,.96]){const p=lerp3(g.fa,g.fb,t),cx=Math.round(p[0]*2),cy=Math.round(p[1]*2),zt=Math.round(p[2]*2)+5;for(let x=cx-2;x<=cx+1;x++){const z=tz(x,cy,zt,0);if(z>=0&&M[I(x,cy,z)]===o.shoe)M[I(x,cy,z)]=0x8c8c98}}
  RH(0,0,26+hz,14+hx,D-1,40+hz,o.band,o.shorts);RH(33+hx,0,26+hz,W-1,D-1,40+hz,o.band,o.shorts);
}

function buildDummy(G){
  G.M.fill(0);
  const{D,M,I,R,E,K,fy}=makeTools(G);
  const WD=0x7a5230,WD2=0x5e3d22,SHT=0x6b7f4a,ST=0xe2c25a,RP=0xc9a86a,BU=0xc8a26a,DK=0x3a2a1a,HAT=0x4e4034,HAT2=0x5a4a3a,PT=0xa0583c;
  K([4,11,1],[20,11,1],1.1,WD2);K([12,3,1],[12,19,1],1.1,WD2);

function openPanel(id){uiPrev=['menu','pausep','select'].find(k=>!$(k).classList.contains('hide'))||uiPrev;$(uiPrev).classList.add('hide');$(id).classList.remove('hide')}
function closePanel(id){$(id).classList.add('hide');$(uiPrev).classList.remove('hide')}
$('help').onclick=$('pHelp').onclick=()=>{renderCtl();openPanel('helpP')};$('hback').onclick=()=>closePanel('helpP');
$('pOpts').onclick=()=>{openPanel('sset');renderSet()};$('pKeys').onclick=()=>{openPanel('kset');renderKeys()};
$('again').onclick=()=>{if(mode!=='online'){startGame('fight');return}if(!net.conn)return;openRoom()};
$('toMenu').onclick=()=>{if(mode==='online')netClose();showTitle()};
$('keys').onclick=()=>{openPanel('kset');renderKeys()};
$('kback').onclick=()=>{rebinding=null;closePanel('kset')};
$('kdef').onclick=()=>{bind=Object.assign({},DEF);saveBind();renderKeys()};
document.addEventListener('pointerlockerror',()=>{lockErrs++});
document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement===cv){hadLock=true;lockErrs=0;return}else if(running&&hadLock)pause()});
addEventListener('keydown',e=>{
  if(rebinding){e.preventDefault();if(e.code!=='Escape'){const c=norm(e.code),other=Object.keys(bind).find(k=>bind[k]===c);if(other&&other!==rebinding)bind[other]=bind[rebinding];bind[rebinding]=c;saveBind()}rebinding=null;renderKeys();return}
  if(e.code==='Escape'){if(running){e.preventDefault();pause()}return}
  if(!running)return;
  const a=actionOf(e.code);
  if(a||e.ctrlKey||e.code==='Space')e.preventDefault();
  if(!a)return;
  if(!e.repeat){if(a==='fwd'||a==='back'||a==='left'||a==='right')tap(a,e.timeStamp);if(a==='jump')jumpPress()}
  keys[a]=true;
});
addEventListener('keyup',e=>{const a=actionOf(e.code);if(a){keys[a]=false;if(tDown[a]!==undefined){tUp[a]=e.timeStamp;tDur[a]=e.timeStamp-tDown[a]}}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('button')){audioInit();sfx('ui')}});
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse')return;e.preventDefault();
  if(!usingTouch){usingTouch=true;renderCtl()}
  if(!running)return;audioInit();if(mode==='online')goFull();
  const x=e.clientX*DPR,y=e.clientY*DPR;let hit=null;
  for(const b of TBTN){if(!btnOn(b))continue;const[bx,by,r]=btnPos(b);if(Math.abs(x-bx)<=r*1.15&&Math.abs(y-by)<=r*1.15){hit=b;break}}
  if(hit){tps.set(e.pointerId,{role:'btn',b:hit});hit.down=true;touchBtn(hit,true);return}
  if(x<VW*.42&&!stick.on){stick.on=true;stick.id=e.pointerId;stick.cx=x;stick.cy=y;stick.x=stick.y=0;tps.set(e.pointerId,{role:'stick'});return}
  tps.set(e.pointerId,{role:'cam',x,y});
},{passive:false});
cv.addEventListener('pointermove',e=>{
  const t=tps.get(e.pointerId);if(!t)return;e.preventDefault();
  const x=e.clientX*DPR,y=e.clientY*DPR;
  if(t.role==='stick'){const R=60*DPR;let dx=x-stick.cx,dy=y-stick.cy;const l=Math.hypot(dx,dy);if(l>R){dx*=R/l;dy*=R/l}stick.x=dx/R;stick.y=-dy/R}
  else if(t.role==='cam'){cam.yaw+=(x-t.x)/DPR*.008*set.sens;cam.pitch=Math.max(1*DEG,Math.min(80*DEG,cam.pitch+(y-t.y)/DPR*.006*set.sens));t.x=x;t.y=y}
},{passive:false});
const touchEnd=e=>{const t=tps.get(e.pointerId);if(!t)return;tps.delete(e.pointerId);if(t.role==='stick'){stick.on=false;stick.x=stick.y=0}else if(t.role==='btn'){t.b.down=false;touchBtn(t.b,false)}};
cv.addEventListener('pointerup',touchEnd);cv.addEventListener('pointercancel',touchEnd);
cv.addEventListener('mousedown',e=>{
  if(usingTouch){usingTouch=false;renderCtl()}
  if(!running)return;e.preventDefault();
  if(document.pointerLockElement!==cv){if(mode==='online')goFull();requestLock();if(lockErrs<3)return}
  if(e.button===0)press('L');else if(e.button===2)press('R');
});
addEventListener('mousemove',e=>{if(!running)return;cam.yaw+=e.movementX*.0026*set.sens;cam.pitch=Math.max(1*DEG,Math.min(80*DEG,cam.pitch+e.movementY*.0022*set.sens))});

const SH_G={W:48,D:72,H:104},DM_G={W:52,D:44,H:104};SH_G.M=new Int32Array(SH_G.W*SH_G.D*SH_G.H);DM_G.M=new Int32Array(DM_G.W*DM_G.D*DM_G.H);
const SHM={},SHM2={},SRM={},SRM2={};let DUM=null;const srReady=[false,false];const EMS=new Set([P1.eye]),EMS2=new Set([P2.eye]);
const jobs=Object.keys(POSES).map(k=>()=>{buildShade(SH_G,P1,POSES[k]);SHM[k]=bake(SH_G,24,20,EMS);SHM[k].eyes=eyePos(SHM[k],P1.eye)});
for(const k of Object.keys(POSES))jobs.push(()=>{buildShade(SH_G,P2,POSES[k]);SHM2[k]=bake(SH_G,24,20,EMS2)});
jobs.push(()=>{buildDummy(DM_G);DUM=bake(DM_G,24,22,new Set())});
let ji=0;
function runJobs(){
  const t0=performance.now();while(ji<jobs.length&&performance.now()-t0<30)jobs[ji++]();
  $('loadt').textContent=`셰이드 도트 만드는 중… ${Math.round(ji/jobs.length*100)}%`;
  if(ji<jobs.length){setTimeout(runJobs,0);return}
  initScratch([...Object.values(SHM),...Object.values(SHM2),DUM]);
  const done=()=>{$('load').classList.add('hide');renderCtl();showTitle()};
  (document.fonts&&document.fonts.load?document.fonts.load('12px Galmuri'):Promise.resolve()).then(done,done);
}
setTimeout(runJobs,30);requestAnimationFrame(loop);
</script>
