<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<style>

.kb{min-width:120px}
.note{font-size:12px;color:#8a8da0;margin:12px 0 0;line-height:1.6}

</style>
</head>

<canvas id="c"></canvas>

<div id="menu" class="ov hide"><div class="panel">
<h1>셰이드 vs 허수아비</h1>
<p class="sub">프로토타입 · 첫 번째 버티컬 슬라이스</p>
<table id="ctl"></table>
<div class="row"><button class="primary" id="go">시작</button><button id="opts">설정</button><button id="keys">키 설정</button></div>
<p class="note">시작하면 전체화면으로 바뀌고 마우스가 화면에 고정돼요. 크롬·엣지 전체화면에서는 Ctrl+W를 눌러도 탭이 닫히지 않아요. Esc를 누르면 이 메뉴로 돌아와요.</p>
</div></div>
<div id="sset" class="ov hide"><div class="panel">

<tr><td>효과음 크기 <span id="volv"></span></td><td><input type="range" id="vol" min="0" max="1" step="0.05"></td></tr>
</table>
<div class="row"><button class="primary" id="sback">돌아가기</button></div>
</div></div>

const LT=(()=>{const v=[0.35,0.25,0.9],l=Math.hypot(v[0],v[1],v[2]);return v.map(a=>a/l)})();

let SCR=null;
function initScratch(models){

const cache=new Map();
function getSprite(m,di,pi,ti,ai){

});
addEventListener('mousemove',e=>{if(!running)return;cam.yaw+=e.movementX*.0026*set.sens;cam.pitch=Math.max(1*DEG,Math.min(80*DEG,cam.pitch+e.movementY*.0022*set.sens))});

const SH_G={W:48,D:72,H:104},DM_G={W:52,D:44,H:104};SH_G.M=new Int32Array(SH_G.W*SH_G.D*SH_G.H);DM_G.M=new Int32Array(DM_G.W*DM_G.D*DM_G.H);
const SHM={};let DUM=null;const EMS=new Set([P1.eye]);
const jobs=Object.keys(POSES).map(k=>()=>{buildShade(SH_G,P1,POSES[k]);SHM[k]=bake(SH_G,24,20,EMS)});
jobs.push(()=>{buildDummy(DM_G);DUM=bake(DM_G,24,22,new Set())});
let ji=0;
function runJobs(){
  const t0=performance.now();while(ji<jobs.length&&performance.now()-t0<30)jobs[ji++]();
  $('loadt').textContent=`셰이드 도트 만드는 중… ${Math.round(ji/jobs.length*100)}%`;
  if(ji<jobs.length){setTimeout(runJobs,0);return}
  initScratch([...Object.values(SHM),DUM]);
  $('load').classList.add('hide');renderCtl();menuEl.classList.remove('hide');
}
setTimeout(runJobs,30);requestAnimationFrame(loop);
</script>
</body>
